{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h1>Login</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
    <label>Email <input type="email" name="email" required autocomplete="username"></label>
    <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
    <button type="submit">Login</button>
</form>
<p>No account? <a href="{{ url_for('register') }}">Register</a> |
   Forgot? <a href="{{ url_for('forgot') }}">Reset password</a></p>
<hr>
<p class="info">Demo accounts:
<code>manager@deskly.local / Manager123!</code> ·
<code>analyst@deskly.local / Analyst123!</code></p>
{% endblock %}
